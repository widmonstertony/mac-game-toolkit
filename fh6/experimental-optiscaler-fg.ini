; EXPERIMENTAL REFERENCE ONLY. Not a complete installer or a working-FG guarantee.
; Merge these keys into the matching OptiScaler version's own INI, do not replace it.
; Do not enable this in online play without checking the game's policy.
; The M2 test encountered failed feature requirements, HUD drift, stutter and
; excessive memory use. The safe one-click preset never activates this file.

[Upscalers]
Dx12Upscaler = ffx

[FrameGen]
Enabled = true
FGInput = dlssg
FGOutput = fsrfg
FGNvngxReplacement = None
FTInput = 0
DrawUIOverFG = true
UIPremultipliedAlpha = true
DisableHudless = false
DisableUI = false

[FSRFG]
AllowAsync = false
FramePacingTuning = true
FPTSafetyMarginInMs = 0.75
FPTVarianceFactor = 0.1
